[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specgate"
version = "0.1.0"
description = "Specification gate for PRD validation"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3,<7",
    "jsonschema>=4.26,<5",
    "coverage>=7.16,<8",
]

# Exact pins: these tools decide whether L1 is red, so a new release must be
# a reviewed change to this file, not a gate that flips on its own overnight.
[project.optional-dependencies]
dev = [
    "ruff==0.16.10",
    "mypy==2.4.0",
    "vulture==2.16",
]

[project.scripts]
specgate = "specgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/specgate"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "specgate/schema"
