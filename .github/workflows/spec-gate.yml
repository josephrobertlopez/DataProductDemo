name: spec-gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  spec-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Vendored in tools/specgate so the gate cannot be swapped by a fetch.
      - name: Install specgate
        run: pip install "./tools/specgate[dev]"
      - name: OpenSpec structure
        run: npx -y @fission-ai/openspec@1.14.0 validate --all --strict --no-interactive
      # openspec validate --strict accepts a requirement with no scenario.
      - name: Every requirement has a scenario
        run: python tools/leftshift/checks.py scenarios
      - name: specgate L0-L5 on every change with a prd.md
        run: python tools/leftshift/checks.py specgate --layers L0-L5 --stage
      - name: trace.json must be byte-identical after regeneration
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --exit-code -- 'openspec/changes/*/trace.json'
          untracked="$(git ls-files --others --exclude-standard -- 'openspec/changes/*/trace.json')"
          if [ -n "$untracked" ]; then echo "untracked trace.json: $untracked" >&2; exit 1; fi

  # Fails unless the commit carries a fresh attestation from the local
  # left-shift run (gates + headless Claude review). Never calls a model.
  attest:
    runs-on: ubuntu-24.04
    steps:
      # The PR head, not the merge ref: the attestation is bound to the tree
      # the author committed, and the merge ref's tree differs from it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The local left-shift run happened on this exact tree
        run: python tools/leftshift/attest.py verify --rev HEAD
